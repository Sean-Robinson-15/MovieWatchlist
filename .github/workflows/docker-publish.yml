name: Build and publish Docker image

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-setup/dockerfile
          push: true
          tags: |
            ghcr.io/sean-robinson-15/moviewatchlist:latest
            ghcr.io/sean-robinson-15/moviewatchlist:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sean-Robinson-15/MovieWatchlist
            org.opencontainers.image.description=MovieWatchlist application
            org.opencontainers.image.title=MovieWatchlist