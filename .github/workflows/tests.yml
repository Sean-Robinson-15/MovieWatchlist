name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]
        story:
          - name: US-01 Create an account
            path: tests/epic01/us01
          - name: US-07 Filter my watchlist
            path: tests/epic02/us07
          - name: US-10 Create a group
            path: tests/epic03/us10
          - name: US-14 Vote on a film
            path: tests/epic03/us14-vote

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run ${{ matrix.story.name }} tests
        run: vendor/bin/phpunit "${{ matrix.story.path }}"